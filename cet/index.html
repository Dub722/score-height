<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>你的四六级分数，换算成游戏里是什么段位</title>
<style>
  /* ─────────────────────────────────────────────────────────────
     设计语言：暖纸底 + 墨色字 + 一根墨玉青的结构线；
     朱红（强调色）全页只出现一次——标在"你落在哪一档"的那个刻度上。
     字号走 clamp 流式缩放，375px 手机与桌面同一套规则。
     这里全部是"版式"。所有数值结论都来自页面底部的 vizkit-data 数据块，
     不在这份样式里、也不在内联 HTML 里写死。
     ───────────────────────────────────────────────────────────── */
  :root{
    --paper:#F4F1EA;
    --ink:#15130F;
    --ink-2:#4A4A4A;
    --ink-3:#8A8A8A;
    --rule:#DCD5C7;
    --rule-2:#EBE5DA;
    --brand:#0D7680;
    --accent:#E3120B;
    --chip-on:#FFFFFF;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;color:var(--ink);background-color:var(--paper);
    background-image:radial-gradient(120% 70% at 50% -12%,#FFFDF8 0%,rgba(255,253,248,0) 62%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.65;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:620px;margin:0 auto;padding:0 26px 76px}

  /* ── 报头 ── */
  .mast{padding:66px 0 0}
  .kicker{margin:0;font-size:11px;letter-spacing:.26em;color:var(--ink-3)}
  .title{margin:20px 0 0;font-size:clamp(30px,9.2vw,46px);font-weight:800;
         line-height:1.08;letter-spacing:-.01em}
  .rule{margin-top:36px;height:1px;background:var(--rule)}

  /* ── 模块 ── */
  .module{padding:46px 0;border-bottom:1px solid var(--rule-2)}
  .page > .module:last-of-type{border-bottom:0}
  .head{display:flex;align-items:center;gap:11px;margin:0 0 28px}
  .dash{width:18px;height:2px;background:var(--brand);flex:none}
  .label{margin:0;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--ink-2)}

  /* ── 选择器（分段控件） ── */
  .picks{display:flex;flex-wrap:wrap;gap:24px 36px}
  .pick-name{display:block;margin:0 0 10px;font-size:11px;letter-spacing:.14em;color:var(--ink-3)}
  .pick-opts{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;
             background:var(--rule-2);border-radius:11px}
  .pick-opts button{
    appearance:none;-webkit-appearance:none;border:0;background:transparent;cursor:pointer;
    padding:7px 15px;border-radius:8px;font:inherit;font-size:14px;line-height:1.2;
    color:var(--ink-2);
    transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease);
  }
  .pick-opts button[aria-pressed=true]{
    background:var(--chip-on);color:var(--ink);font-weight:700;
    box-shadow:0 1px 2px rgba(21,19,15,.12);
  }

  /* ── 输入读数 ── */
  .readout{display:flex;align-items:baseline;gap:10px}
  .readout input{
    flex:1 1 auto;min-width:0;width:100%;margin:0;padding:0 0 8px;
    border:0;border-bottom:2px solid transparent;background:transparent;
    color:var(--ink);font:inherit;font-weight:800;
    font-size:clamp(52px,17vw,80px);line-height:1;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;outline:none;
    transition:border-color .25s var(--ease);
    -moz-appearance:textfield;
  }
  .readout input::-webkit-outer-spin-button,
  .readout input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .readout input:focus{border-bottom-color:var(--brand)}
  .unit{flex:none;font-size:17px;font-weight:500;color:var(--ink-3)}

  /* ── 刻度轨 ── */
  .rail{position:relative;margin:34px 0 0}
  .rail::before{content:"";position:absolute;left:0;right:0;top:21px;height:2px;
                background:var(--rule);border-radius:2px}
  .rail .fill{position:absolute;left:0;top:21px;height:2px;width:0;z-index:1;
              background:var(--brand);border-radius:2px;transition:width .12s var(--ease)}
  .rail input[type=range]{
    -webkit-appearance:none;appearance:none;position:relative;z-index:2;
    width:100%;height:44px;margin:0;background:transparent;cursor:grab;
  }
  .rail input[type=range]:active{cursor:grabbing}
  .rail input[type=range]::-webkit-slider-runnable-track{height:2px;background:transparent}
  .rail input[type=range]::-moz-range-track{height:2px;background:transparent;border:0}
  .rail input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:26px;height:26px;margin-top:-12px;
    border-radius:50%;background:var(--paper);border:2px solid var(--ink);
    box-shadow:0 2px 10px rgba(21,19,15,.20);
    transition:transform .18s var(--ease),box-shadow .18s var(--ease);
  }
  .rail input[type=range]::-moz-range-thumb{
    width:26px;height:26px;border-radius:50%;background:var(--paper);
    border:2px solid var(--ink);box-shadow:0 2px 10px rgba(21,19,15,.20);
  }
  .rail input[type=range]:active::-webkit-slider-thumb{transform:scale(1.16)}
  .scale{position:relative;height:34px;margin-top:6px}
  .tick{position:absolute;top:0;transform:translateX(-50%);cursor:pointer;
        font-size:11px;letter-spacing:.02em;color:var(--ink-3);white-space:nowrap;
        transition:color .25s var(--ease)}
  .tick i{display:block;width:1px;height:7px;margin:0 auto 6px;background:var(--rule);
          transition:background .25s var(--ease),height .25s var(--ease)}
  .tick.on{color:var(--accent)}
  .tick.on i{background:var(--accent);height:13px}

  /* ── 结论 ── */
  .verdict{display:flex;align-items:baseline;gap:12px}
  .num{font-size:clamp(62px,21vw,106px);font-weight:800;line-height:.9;
       letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  /* 档位名比数字长得多：四个汉字放在 106px 下会顶破容器，所以单独一档字号。
     `text-wrap:balance` 让长名字（无敌战神）在窄屏上折得好看些。 */
  .num.is-name{font-size:clamp(34px,10.5vw,58px);line-height:1.12;letter-spacing:-.01em;
               text-wrap:balance}
  .verdict .unit{font-size:18px}
  /* 对照表里的档位序号：跟在段位名后面当小字。序号不是给读者看的结论，
     是给"同档之内偏上还是偏下"用的——所以它必须比名字小一档、颜色退一级。 */
  .ord{margin-left:6px;font-size:12px;font-weight:500;color:var(--ink-3);
       font-variant-numeric:tabular-nums}
  .rank{margin:24px 0 0;font-size:15px;letter-spacing:.01em;color:var(--ink-2)}
  .rank b{font-weight:800;color:var(--ink)}
  .meter{margin-top:16px;height:4px;border-radius:4px;background:var(--rule-2);overflow:hidden}
  .meter span{display:block;height:100%;width:0;border-radius:4px;background:var(--brand);
              transition:width .5s var(--ease)}
  .note{margin:22px 0 0;font-size:13px;line-height:1.75;color:var(--ink-3)}
  /* 模型适用区间之外：必须说出来，不能让一个外推值看起来像结论 */
  .caveat{display:none;margin:16px 0 0;padding:11px 13px;border-radius:7px;
          background:var(--rule-2);font-size:12.5px;line-height:1.75;
          letter-spacing:.2px;color:var(--ink-2)}
  .caveat.on{display:block}
  .caveat b{font-weight:700;color:var(--ink)}

  /* ── 桌面：宽屏下不是一个窄柱，而是两块并读 ──
     手机（WeChat 的主场景）保持单列；只在 ≥880px 时改成两栏。 */
  @media (min-width:880px){
    .page{max-width:1060px;padding:0 56px 104px}
    .duo{display:grid;grid-template-columns:1fr 1fr;column-gap:72px;
         border-bottom:1px solid var(--rule-2)}
    .duo .module{border-bottom:0;padding-bottom:40px}
    .title{font-size:52px}
  }

  /* ── 曲线 ── */
  .chart{margin:2px 0 0}
  .chart svg{display:block;width:100%;height:170px}
  .curve{fill:none;stroke:var(--brand);stroke-width:2;
         stroke-linecap:round;stroke-linejoin:round}
  .cursor{stroke:var(--rule);stroke-width:1}
  .dot{fill:var(--accent);stroke:var(--paper);stroke-width:2}
  .ref{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4}
  .ref-label{fill:var(--ink-3);font-size:11px}
  .caption{margin:18px 0 0;font-size:12px;line-height:1.75;color:var(--ink-3)}

  /* ── 对照表 ── */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:right;padding:15px 0;border-bottom:1px solid var(--rule-2)}
  th:first-child,td:first-child{text-align:left}
  th{padding-bottom:11px;font-size:11px;font-weight:600;letter-spacing:.12em;
     color:var(--ink-3);border-bottom:1px solid var(--ink)}
  td{font-size:16px;color:var(--ink-3)}
  td.v{font-weight:700;color:var(--ink)}
  tr.on td{color:var(--ink-2)}
  tr.on td.v{color:var(--ink)}
  tr.on td:first-child::before{content:"";display:inline-block;width:6px;height:6px;
     margin-right:10px;border-radius:50%;background:var(--accent);vertical-align:middle}

  /* ── 页脚 ── */
  .colophon{margin-top:48px;font-size:11px;line-height:1.85;color:var(--ink-3)}
  .colophon a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule)}

  /* ── 入场 ── */
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .anim{animation:rise .72s var(--ease) both}
  @media (prefers-reduced-motion:reduce){
    .anim{animation:none}
    .rail .fill,.meter span,.tick,.tick i,.readout input{transition:none}
  }

  /* ── 深色 ──
     只换变量，不动任何布局。用的两个色取自引擎里**为深底验证过**的那一档：
     封面线 #2FA8B4 与封面深底 #0B1A1C 的同族色。 */
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#14120F; --ink:#F2EFE7; --ink-2:#B8B0A2; --ink-3:#8A8177;
      --rule:#2E2A24; --rule-2:#241F1A;
      --brand:#2FA8B4; --accent:#FF5A4A; --chip-on:#332E27;
    }
    body{background-image:radial-gradient(120% 70% at 50% -12%,#1E1B16 0%,rgba(30,27,22,0) 62%)}
  }
</style>
</head>
<body>
<main class="page">

  <header class="mast anim" style="animation-delay:.02s">
    <p class="kicker">数字体感 · 换个单位看自己</p>
    <h1 class="title">你的四六级分数，换算成游戏里是什么段位</h1>
    <div class="rule"></div>
  </header>

  <section class="module anim" id="picks-module" style="animation-delay:.06s">
    <div class="head"><span class="dash"></span><h2 class="label">你的情况</h2></div>
    <div class="picks" id="picks"></div>
  </section>

  <div class="duo">

  <section class="module anim" style="animation-delay:.10s">
    <div class="head"><span class="dash"></span><h2 class="label">你的四六级分数</h2></div>
    <div class="readout">
      <input id="v" type="number" inputmode="decimal" step="any" autocomplete="off"
             value="550" aria-label="四六级分数">
      <span class="unit">分</span>
    </div>
    <div class="rail">
      <span class="fill" id="fill"></span>
      <input id="r" type="range" min="0" max="1000" step="1" value="500"
             aria-label="四六级分数 滑杆">
      <div class="scale" id="scale"></div>
    </div>
  </section>

  <section class="module anim" style="animation-delay:.18s">
    <div class="head"><span class="dash"></span><h2 class="label">换算出的游戏段位</h2></div>
    <div class="verdict">
      <span class="num" id="num">—</span>
      <span class="unit">档</span>
    </div>
    <p class="rank" id="rank" aria-live="polite"></p>
    <div class="meter"><span id="bar"></span></div>
    <p class="caveat" id="caveat"></p>
    <p class="note" id="note"></p>
  </section>

  </div>

  <section class="module anim" style="animation-delay:.26s">
    <div class="head"><span class="dash"></span><h2 class="label">换算曲线</h2></div>
    <div class="chart"><svg id="chart" role="img" aria-label="四六级分数与游戏段位的换算曲线"></svg></div>
    <p class="caption">曲线越平，说明这一段人越挤——同样的增量，换算出的游戏段位涨得越少。</p>
  </section>

  <section class="module anim" style="animation-delay:.34s">
    <div class="head"><span class="dash"></span><h2 class="label">四六级分数对照</h2></div>
    <table>
      <thead><tr><th>四六级分数</th><th>游戏段位</th><th>位次</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <footer class="colophon anim" style="animation-delay:.42s">
    数据来源：<a href="https://cet.neea.edu.cn/xhtml1/folder/19081/5124-1.htm" rel="noopener">中国教育考试网（NEEA）大学英语四、六级考试《分数解释》</a> · 取数 2026-10-12
  </footer>

</main>

     轴的名称与选项来自 spec 的 `selectors`（界面元数据）；
     每个选项对应的分布来自引擎导出的 `lookups`。
     页面自己不含任何数字——切一次维度，就是把另一条引擎算过的曲线读出来。 */
  var dims = D.selectors || [];
  var sel = {};
  dims.forEach(function (d) {
    if (d.options && d.options.length) { sel[d.key] = d.options[0].value; }
  });
  function isDefault() {
    for (var i = 0; i < dims.length; i++) {
      var d = dims[i];
      if (!d.options || !d.options.length) { continue; }
      if (sel[d.key] !== d.options[0].value) { return false; }
    }
    return true;
  }
  function distFor(axis, s) {
    var base = axis === 'input' ? D.input.dist : D.output.dist;
    var out = { kind: base.kind, params: base.params };
    (D.lookups || []).forEach(function (lk) {
      if (lk.axis !== axis) { return; }
      for (var k in lk.when) { if (s[k] !== lk.when[k]) { return; } }
      out = lk.dist;
    });
    return out;
  }
  function convertWith(v, s) {
    var src = distFor('input', s), dst = distFor('output', s);
    var c = _cdfOf(src.kind, v, src.params);
    var p = Math.min(Math.max(c, 1e-12), 1 - 1e-12);
    return [_ppfOf(dst.kind, p, dst.params), _tailOf(src.kind, v, src.params) * 100];
  }

  /* 滑杆量程随所选口径变——否则换一档之后滑杆就在"说谎"。
     取该口径的 1% / 99% 分位，并把所有参考刻度兜进来；
     对数轴（收入一类）走 log 映射，不然 99% 的量程会挤在最左端。 */
  var lo = 0, hi = 1, span = 1;
  function computeRange() {
    var d = distFor('input', sel);
    var a = _ppfOf(d.kind, 0.01, d.params), b = _ppfOf(d.kind, 0.99, d.params);
    if (ticks.length) {
      a = Math.min(a, Math.min.apply(null, ticks));
      b = Math.max(b, Math.max.apply(null, ticks));
    }
    if (logS) { a = Math.log(Math.max(a, 1e-6)); b = Math.log(Math.max(b, 1e-6)); }
    var pad = ((b - a) || 1) * 0.05;   /* 两端各留 5%，贴边的刻度标签才不会被切掉 */
    lo = a - pad; hi = b + pad; span = (hi - lo) || 1;
  }
  function pos(v) { return ((logS ? Math.log(Math.max(v, 1e-6)) : v) - lo) / span; }
  function val(p) { var t = lo + span * p; return logS ? Math.exp(t) : t; }

  /* 参考刻度：全部由数据生成——页面里不写死任何数字 */
  ticks.forEach(function (t) {
    var s = document.createElement('span');
    s.className = 'tick';
    s.setAttribute('data-at', String(t));
    s.innerHTML = '<i></i>' + fmtThousands(t);
    s.addEventListener('click', function () { el.v.value = String(Math.round(t)); render(false); });
    el.scale.appendChild(s);
  });
  var tickEls = [].slice.call(el.scale.children);

  function placeTicks() {
    tickEls.forEach(function (t) {
      t.style.display = '';
      t.style.left = (Math.min(Math.max(pos(parseFloat(t.getAttribute('data-at'))), 0), 1) * 100) + '%';
    });
    /* 刻度自动减个：相邻标签挨太近就藏掉后面那个，而不是让它们叠在一起。
       和引擎出图同一条规则（"刻度该由数据决定，不是由画布决定"）。 */
    var w = el.scale.clientWidth || 320, last = -1e9;
    tickEls.forEach(function (t) {
      var x = (parseFloat(t.style.left) / 100) * w;
      var half = (t.offsetWidth || (t.textContent.length * 7)) / 2;
      if (x - half < last + 8) { t.style.display = 'none'; } else { last = x + half; }
    });
  }

  /* 档位名：与 distFor 同一套命中规则（轴过滤 + when 全匹配）。
     为什么必须同一套：否则会出现「分布换成了无畏契约、名字还是王者荣耀」，
     而这两份东西一旦分叉，页面上给出的就是一个不存在的段位。 */
  function ranksFor(s) {
    var out = (D.output && D.output.ranks) || [];
    (D.lookups || []).forEach(function (lk) {
      if (lk.axis !== 'output' && lk.axis != null) { return; }
      if (!lk.ranks || !lk.ranks.length) { return; }
      var hit = true;
      for (var k in lk.when) {
        if (!Object.prototype.hasOwnProperty.call(lk.when, k)) { continue; }
        if (lk.when[k] !== s[k]) { hit = false; break; }
      }
      if (hit) { out = lk.ranks; }
    });
    return out;
  }

  /* 按**人口区间**判档位名：先把「每档人数中点」还原成上边缘
     （A₁ = 100，A(k+1) = 2·t_k − A_k），再看这个上尾百分比落在哪一段。
     为什么不能按序号四舍五入：序号是插值出来的连续值，而档位是按人数切开的，
     边界上两者不重合——425 分在王者荣耀插值出 2.35，离白银更近，却在黄金档里。
     与 Python 的 model.rank_at 逐项对账（tests/page_model.py）。 */
  function rankAt(s, topPct) {
    var dst = distFor('output', s);
    if (dst.kind !== 'empirical') { return ''; }
    var pts = (dst.params && dst.params.points) || [];
    var ranks = ranksFor(s);
    if (!ranks.length || pts.length !== ranks.length) { return ''; }
    var edges = [100], i;
    for (i = 0; i < pts.length; i++) { edges.push(2 * pts[i][1] - edges[i]); }
    for (i = 0; i < ranks.length; i++) {
      if (topPct <= edges[i] && topPct >= edges[i + 1]) { return ranks[i]; }
    }
    return topPct < edges[edges.length - 1] ? ranks[ranks.length - 1] : ranks[0];
  }

  /* 对照表按当前口径现算（仍是引擎的同一套分布参数，不是页面自带的数据） */
  var rowEls = [];
  function buildTable() {
    var src = distFor('input', sel), dst = distFor('output', sel);
    el.rows.innerHTML = ticks.map(function (t) {
      var c = _cdfOf(src.kind, t, src.params);
      var p = Math.min(Math.max(c, 1e-12), 1 - 1e-12);
      var tail = _tailOf(src.kind, t, src.params) * 100;
      var name = rankAt(sel, tail);
      var ord = fmtNum(_ppfOf(dst.kind, p, dst.params), 1);
      return '<tr data-at="' + t + '"><td>' + fmtThousands(t) + '</td><td class="v">' +
             (name ? name + '<span class="ord">' + ord + D.output.unit + '</span>' : ord) +
             '</td><td>' + fmtPct(tail) + '</td></tr>';
    }).join('');
    rowEls = [].slice.call(el.rows.children);
  }

  /* 选择器界面 */
  var picksModule = $('picks-module');
  var pickRefs = [];
  if (!dims.length) {
    if (picksModule) { picksModule.style.display = 'none'; }
  } else {
    dims.forEach(function (d) {
      var wrap = document.createElement('div');
      wrap.className = 'pick';
      var nm = document.createElement('span');
      nm.className = 'pick-name';
      nm.textContent = d.label || d.key;
      var box = document.createElement('div');
      box.className = 'pick-opts';
      var items = [];
      (d.options || []).forEach(function (opt) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = opt.label || opt.value;
        b.addEventListener('click', function () { choose(d.key, opt.value); });
        box.appendChild(b);
        items.push({ btn: b, opt: opt });
      });
      wrap.appendChild(nm);
      wrap.appendChild(box);
      el.picks.appendChild(wrap);
      pickRefs.push({ key: d.key, items: items });
    });
  }

  /* 选项可以声明 onlyFor：例如「物理类/历史类」只对分了文理的省份成立，
     山东、北京、浙江是 3+3 不分文理。切换地区时，失效的那一档自动让位给
     第一个可用的选项——否则会算出一条根本不存在的口径。 */
  function optionAllowed(opt) {
    var only = opt.onlyFor;
    if (!only) { return true; }
    for (var k in only) {
      if (!Object.prototype.hasOwnProperty.call(only, k)) { continue; }
      var want = only[k];
      var ok = (want instanceof Array) ? (want.indexOf(sel[k]) >= 0) : (sel[k] === want);
      if (!ok) { return false; }
    }
    return true;
  }
  function syncPicks() {
    pickRefs.forEach(function (ref) {
      var firstOk = null, curOk = false;
      ref.items.forEach(function (it) {
        var ok = optionAllowed(it.opt);
        it.btn.style.display = ok ? '' : 'none';
        if (ok) {
          if (firstOk === null) { firstOk = it.opt.value; }
          if (it.opt.value === sel[ref.key]) { curOk = true; }
        }
      });
      if (!curOk && firstOk !== null) { sel[ref.key] = firstOk; }
      ref.items.forEach(function (it) {
        it.btn.setAttribute('aria-pressed', it.opt.value === sel[ref.key] ? 'true' : 'false');
      });
    });
  }
  function choose(key, value) {
    sel[key] = value;
    refresh();
  }

  /* 模型适用区间：分布是用两个锚点拟合的，锚点之外是外推。
     高考分数有硬上界（满分），而正态没有——外推在高分段会把位次算得偏高，
     于是"接近满分"被换算成一个偏矮的身高。这种事不能默默发生。 */
  function updateCaveat(v) {
    var band = D.input.trusted;
    if (!band) { el.caveat.classList.remove('on'); return; }
    var msg = '';
    var rng = fmtNum(band[0], 0) + '–' + fmtNum(band[1], 0) + ' 分';
    if (v > band[1]) {
      msg = '已经超出模型适用区间（' + rng + '）。这一段几乎没有样本，正态近似会把你的位次'
          + '<b>算得偏高</b>——真实身高比上面这个数更高，高多少我们不敢说。';
    } else if (v < band[0]) {
      msg = '已经低于模型适用区间（' + rng + '）。这里是外推，位次不可靠。';
    }
    el.caveat.innerHTML = msg;
    el.caveat.classList.toggle('on', !!msg);
  }

  /* 参考结论只在默认口径下显示——换了口径就不该再引它 */
  var flagship = D.claims["g_wzry_550"];
  var noteText = flagship ? ('参考：' + flagship.text + '（' + fmtPct(flagship.percentile) + '）') : '';
  function updateNote() {
    var show = !!noteText && isDefault();
    el.note.textContent = show ? noteText : '';
    el.note.style.display = show ? '' : 'none';
  }

  /* 换算曲线：80 个采样点全部现场算，页面不缓存任何数据 */
  var SVGNS = 'http://www.w3.org/2000/svg';
  var chart = document.getElementById('chart');
  var cursorEl = null, dotEl = null;
  var yOf = function () { return 0; };

  function buildCurve() {
    var w = chart.clientWidth || 600, h = 170, N = 80, py = 18;
    chart.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    while (chart.firstChild) { chart.removeChild(chart.firstChild); }
    var pts = [], mn = Infinity, mx = -Infinity, i, xv, yv;
    for (i = 0; i < N; i++) {
      xv = val(i / (N - 1));
      yv = convertWith(xv, sel)[0];
      if (yv < mn) { mn = yv; }
      if (yv > mx) { mx = yv; }
      pts.push([i / (N - 1), yv]);
    }
    var range = (mx - mn) || 1;
    yOf = function (v) { return h - py - ((v - mn) / range) * (h - py * 2); };
    function mk(tag, cls, attrs) {
      var node = document.createElementNS(SVGNS, tag);
      node.setAttribute('class', cls);
      Object.keys(attrs).forEach(function (a) { node.setAttribute(a, attrs[a]); });
      chart.appendChild(node);
      return node;
    }
    mk('path', 'curve', { d: pts.map(function (p, k) {
      return (k ? 'L' : 'M') + (p[0] * w).toFixed(1) + ' ' + yOf(p[1]).toFixed(1);
    }).join(' ') });

    /* 参考线：换算量的中间值。让曲线不只是一个形状——读者一眼看出
       自己落在中间值之上还是之下。 */
    var od = distFor('output', sel);
    var ref = od.kind === 'normal' ? od.params.mean : od.params.median;
    if (isFinite(ref) && ref > mn && ref < mx) {
      var ry = yOf(ref);
      mk('line', 'ref', { x1: 0, x2: w, y1: ry, y2: ry });
      var lab = document.createElementNS(SVGNS, 'text');
      lab.setAttribute('class', 'ref-label');
      lab.setAttribute('x', 2);
      lab.setAttribute('y', ry - 7);
      lab.textContent = '中位 ' + fmtNum(ref, 1) + D.output.unit;
      chart.appendChild(lab);
    }

    cursorEl = mk('line', 'cursor', { x1: 0, x2: 0, y1: py, y2: h - py });
    dotEl = mk('circle', 'dot', { r: 5, cx: 0, cy: 0 });
  }

  var raf = null;
  function countTo(to) {
    if (reduce) { el.num.textContent = to.toFixed(1); return; }
    var from = parseFloat(el.num.textContent);
    if (!isFinite(from)) { from = to; }
    var t0 = performance.now();
    if (raf) { cancelAnimationFrame(raf); }
    (function step(now) {
      var k = Math.min(1, (now - t0) / 460);
      var e = 1 - Math.pow(1 - k, 3);
      el.num.textContent = (from + (to - from) * e).toFixed(1);
      if (k < 1) { raf = requestAnimationFrame(step); }
    })(t0);
  }

  function render(fromRail) {
    var v = parseFloat(el.v.value);
    if (!isFinite(v)) { return; }
    var t = Math.min(Math.max(pos(v), 0), 1);
    el.fill.style.width = (t * 100) + '%';
    if (!fromRail) {
      var rv = String(Math.round(t * 1000));
      if (el.r.value !== rv) { el.r.value = rv; }
    }

    var res = convertWith(v, sel);
    updateCaveat(v);
    // 有档位名就把名字当结论，序号降级成小字。为什么要这样排：
    // 「4.2 档」读者看不懂，「荣耀黄金」一眼就懂，而序号仍然有用（它是连续值，
    // 能看出在档内偏上还是偏下），所以不删，只是不再当主角。
    var name = rankAt(sel, res[1]);
    if (name) {
      // 结论位置**只印档位名**。序号不进这里：它是连续值，读者看不懂，
      // 而且会让人以为"4.2 档"才是答案。序号仍然有用（能看出在档内偏上还是偏下），
      // 所以放在下面那张对照表里当小字，不当主角。
      el.num.textContent = name;
      el.num.classList.add('is-name');
      el.unit.textContent = '';
    } else {
      el.num.classList.remove('is-name');
      el.unit.textContent = D.output.unit;
      countTo(res[0]);
    }
    var beat = Math.max(0, Math.min(100, 100 - res[1]));
    el.rank.innerHTML = '同一分位对齐 · 超过了 <b>' + fmtNum(beat, 1) + '%</b> 的人';
    el.bar.style.width = beat + '%';

    if (dotEl) {
      var cx = Math.min(Math.max(pos(v), 0), 1) * (chart.clientWidth || 600);
      dotEl.setAttribute('cx', cx);
      dotEl.setAttribute('cy', yOf(res[0]));
      cursorEl.setAttribute('x1', cx);
      cursorEl.setAttribute('x2', cx);
    }

    var best = Infinity, near = null;
    tickEls.forEach(function (el2) {
      var d = Math.abs(parseFloat(el2.getAttribute('data-at')) - v);
      if (d < best) { best = d; near = el2; }
    });
    tickEls.forEach(function (el2) { el2.classList.toggle('on', el2 === near); });
    rowEls.forEach(function (row) {
      row.classList.toggle('on', Math.abs(parseFloat(row.getAttribute('data-at')) - v) === best);
    });
  }

  function refresh() {
    syncPicks();          /* 先让失效的选项让位，再按最终口径重算 */
    computeRange();
    placeTicks();
    buildCurve();
    buildTable();
    updateNote();
    render(true);
  }

  el.v.addEventListener('input', function () { render(false); });
  el.r.addEventListener('input', function () {
    el.v.value = String(Math.round(val(parseFloat(el.r.value) / 1000)));
    render(true);
  });

  var rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      computeRange(); placeTicks(); buildCurve(); render(true);
    });
  });

  syncPicks();
  computeRange();
  placeTicks();
  buildCurve();
  buildTable();
  updateNote();
  render(false);
})();
</script>
</body>
</html>
